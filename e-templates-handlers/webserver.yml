---
- name: Deploy a web page with nginx
  hosts: linux_servers
  become: true
  gather_facts: true

  vars:
    site_title: "Learning Ansible"
    nginx_port: 8080
    team:
      - Subbu
      - Ansible

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy the home page from a template
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Make nginx listen on the chosen port
      ansible.builtin.lineinfile:
        path: /etc/nginx/sites-available/default
        regexp: '^\s*listen \d+ default_server;'
        line: "        listen {{ nginx_port }} default_server;"
      notify: Restart nginx

    - name: Make sure nginx is running and starts on boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
