---
- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Add a message of the day
  ansible.builtin.copy:
    dest: /etc/motd
    content: "This server ({{ ansible_hostname }}) is managed by Ansible.\n"
    mode: "0644"
